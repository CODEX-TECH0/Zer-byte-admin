<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin Login - zerøbyte</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.card { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px); border-radius: 32px; border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px 30px; width: 100%; max-width: 400px; text-align: center; }
h1 { font-size: 28px; margin-bottom: 10px; color: white; }
.subtitle { color: #94a3b8; margin-bottom: 30px; font-size: 14px; }
.input-field { width: 100%; padding: 14px 16px; margin: 10px 0; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; background: rgba(255, 255, 255, 0.08); color: white; font-size: 16px; outline: none; }
button { width: 100%; padding: 14px; border: none; border-radius: 16px; background: linear-gradient(135deg, #7c3aed, #a855f7); color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 10px; }
.alert { padding: 12px; border-radius: 12px; margin-top: 16px; font-size: 13px; display: none; }
.alert.error { background: rgba(239,68,68,0.2); color: #fca5a5; display: block; }
.alert.success { background: rgba(34,197,94,0.2); color: #86efac; display: block; }
.back-link { display: block; margin-top: 20px; color: #64748b; text-decoration: none; font-size: 13px; }
</style>
</head>
<body>
<div class="card">
    <i class="fas fa-shield-alt" style="font-size: 48px; color: #a855f7; margin-bottom: 20px;"></i>
    <h1>Admin Portal</h1>
    <p class="subtitle">Secure access to platform management</p>
    <input type="email" id="email" class="input-field" placeholder="Admin Email" value="codextech71@gmail.com">
    <input type="password" id="password" class="input-field" placeholder="Password">
    <button id="loginBtn">Access Dashboard</button>
    <div id="alert" class="alert"></div>
    <a href="../zerobyte_chat/index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Chat</a>
</div>
<script>
const _supabase = window.supabase.createClient(
    "https://ievgpyzphaialonfonof.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlldmdweXpwaGFpYWxvbmZvbm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2Njk2MTAsImV4cCI6MjA5NDI0NTYxMH0.tg3ao7uROEZqvw1Tlkpe2o5glMF7LNRDj6uYaOs_Zvs"
);
document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const alertDiv = document.getElementById("alert");
    if (!email || !password) { alertDiv.className = "alert error"; alertDiv.innerHTML = "Please fill all fields"; return; }
    alertDiv.className = "alert success"; alertDiv.innerHTML = "Logging in...";
    const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
    if (error) { alertDiv.className = "alert error"; alertDiv.innerHTML = error.message; return; }
    const { data: profile } = await _supabase.from("profiles").select("is_admin").eq("id", data.user.id).single();
    if (!profile?.is_admin) { await _supabase.auth.signOut(); alertDiv.className = "alert error"; alertDiv.innerHTML = "Access denied. Admin only."; return; }
    alertDiv.innerHTML = "Access granted! Redirecting...";
    setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);
});
</script>
</body>
</html>
