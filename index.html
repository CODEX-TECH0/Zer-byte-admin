<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin portal for zerøbyte - Manage users, messages, and platform settings.">
  <meta name="robots" content="noindex, nofollow">
  <title>zerøbyte | Admin Portal - Secure Access</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .admin-container {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 28px;
      padding: 45px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
      animation: fadeInUp 0.5s ease;
      border: 1px solid rgba(124, 58, 237, 0.3);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 25px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    .admin-badge {
      text-align: center;
      color: #ef4444;
      font-size: 13px;
      margin-bottom: 30px;
    }

    .admin-badge i {
      margin-right: 5px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #94a3b8;
      font-weight: 500;
    }

    label i {
      margin-right: 8px;
      color: #7c3aed;
    }

    input, select {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 14px;
      color: white;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #7c3aed;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    select option {
      background: #1e1b4b;
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 10px;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(124, 58, 237, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .back-link {
      text-align: center;
      margin-top: 25px;
    }

    .back-link a {
      color: #7c3aed;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    .message {
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 25px;
      text-align: center;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .error {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
    }

    .success {
      background: rgba(34, 197, 94, 0.2);
      border: 1px solid #22c55e;
      color: #22c55e;
    }

    .info {
      background: rgba(124, 58, 237, 0.2);
      border: 1px solid #7c3aed;
      color: #7c3aed;
    }

    .admin-selector {
      margin-bottom: 20px;
    }

    .admin-selector label {
      font-size: 13px;
      margin-bottom: 5px;
    }

    .security-note {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: #64748b;
    }

    @media (max-width: 640px) {
      .admin-container {
        padding: 30px 25px;
      }
      
      .logo {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="logo">zerøbyte</div>
    <h2>Admin Portal</h2>
    <div class="admin-badge"><i class="fas fa-shield-alt"></i> Restricted Access - Authorized Personnel Only</div>
    
    <div id="message"></div>
    
    <form id="adminLoginForm">
      <div class="admin-selector">
        <label><i class="fas fa-user-tie"></i> Quick Select Admin</label>
        <select id="adminSelect" onchange="selectAdmin()">
          <option value="">-- Select Admin Account --</option>
          <option value="okpalachimaobi55@gmail.com">👑 Okpalachima Obi (Super Admin)</option>
          <option value="codextech71@gmail.com">🛡️ Codex Tech (Admin)</option>
        </select>
      </div>
      
      <div class="form-group">
        <label><i class="fas fa-envelope"></i> Email Address</label>
        <input type="email" id="email" placeholder="admin@zerobyte.com" autocomplete="email">
      </div>
      
      <div class="form-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <input type="password" id="password" placeholder="Enter your admin password" autocomplete="current-password">
      </div>
      
      <button type="submit" class="btn-primary" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Access Admin Panel
      </button>
    </form>
    
    <div class="back-link">
      <a href="../index.html"><i class="fas fa-arrow-left"></i> Back to zerøbyte</a>
    </div>
    
    <div class="security-note">
      <i class="fas fa-lock"></i> Secure encrypted connection
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://yaibrpthbugcycvzbuie.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaWJycHRoYnVnY3ljdnpidWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTIzMDMsImV4cCI6MjA5NDU4ODMwM30.-BwWDwdpL9rAois22PU3ATtzlAzdSx9qN6L71czHFXU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const messageDiv = document.getElementById('message');
    const loginBtn = document.getElementById('loginBtn');
    
    function showMessage(text, type) {
      messageDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
      setTimeout(() => {
        messageDiv.innerHTML = '';
      }, 5000);
    }

    window.selectAdmin = () => {
      const select = document.getElementById('adminSelect');
      const email = select.value;
      if (email) {
        document.getElementById('email').value = email;
        showMessage(`Selected: ${email}. Enter your password to continue.`, 'info');
        document.getElementById('password').focus();
      }
    };

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if (!email || !password) {
        showMessage('Please enter both email and password', 'error');
        return;
      }
      
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
      
      try {
        const { data, error } = await _supabase.auth.signInWithPassword({
          email,
          password,
        });
        
        if (error) throw error;
        
        // Check if user is admin
        const { data: profile, error: profileError } = await _supabase
          .from('profiles')
          .select('is_admin, display_name, email')
          .eq('id', data.user.id)
          .single();
        
        if (profileError) throw profileError;
        
        if (!profile || !profile.is_admin) {
          await _supabase.auth.signOut();
          throw new Error('⛔ Access Denied: You are not authorized as an administrator.');
        }
        
        showMessage(`✓ Welcome Admin ${profile.display_name || profile.email}! Redirecting to dashboard...`, 'success');
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);
        
      } catch (error) {
        showMessage(error.message, 'error');
        loginBtn.disabled = false;
        loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Access Admin Panel';
      }
    });
  </script>
</body>
</html>
