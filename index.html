<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="/admin/manifest.json">
  <meta name="theme-color" content="#3B82F6">
  <title>zerøbyte | Admin Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #3B82F6, #06B6D4);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .admin-container {
      background: white;
      border-radius: 30px;
      padding: 45px;
      width: 100%;
      max-width: 460px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    }
    .logo { text-align: center; font-size: 32px; font-weight: bold; margin-bottom: 30px; background: linear-gradient(135deg, #3B82F6, #06B6D4); -webkit-background-clip: text; background-clip: text; color: transparent; }
    h2 { text-align: center; margin-bottom: 8px; color: #1E293B; }
    .admin-badge { text-align: center; color: #EF4444; font-size: 13px; margin-bottom: 30px; }
    .form-group { margin-bottom: 22px; }
    label { display: block; margin-bottom: 8px; color: #1E293B; }
    input { width: 100%; padding: 14px; background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 16px; font-size: 16px; }
    input:focus { outline: none; border-color: #3B82F6; }
    .btn-primary {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #3B82F6, #06B6D4);
      border: none; border-radius: 40px; color: white; font-size: 16px; font-weight: 600; cursor: pointer;
    }
    .back-link { text-align: center; margin-top: 25px; }
    .back-link a { color: #3B82F6; text-decoration: none; }
    .message { padding: 14px; border-radius: 16px; margin-bottom: 25px; text-align: center; }
    .error { background: #FEE2E2; border: 1px solid #EF4444; color: #DC2626; }
    .success { background: #DCFCE7; border: 1px solid #22C55E; color: #16A34A; }
    .loading { display: inline-block; width: 18px; height: 18px; border: 2px solid white; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="logo">zerøbyte Admin</div>
    <h2>Admin Portal</h2>
    <div class="admin-badge"><i class="fas fa-shield-alt"></i> Restricted Access</div>
    <div id="message"></div>
    <form id="adminLoginForm">
      <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="admin@zerobyte.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="password"></div>
      <button type="submit" class="btn-primary" id="loginBtn">Login as Admin</button>
    </form>
    <div class="back-link"><a href="../index.html">← Back to zerøbyte</a></div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://yaibrpthbugcycvzbuie.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaWJycHRoYnVnY3ljdnpidWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTIzMDMsImV4cCI6MjA5NDU4ODMwM30.-BwWDwdpL9rAois22PU3ATtzlAzdSx9qN6L71czHFXU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    const msgDiv = document.getElementById('message');
    const loginBtn = document.getElementById('loginBtn');
    
    function showMessage(text, type) {
      msgDiv.innerHTML = `<div class="message ${type}">${text}</div>`;
      setTimeout(() => msgDiv.innerHTML = '', 5000);
    }
    
    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      if (!email || !password) {
        showMessage('Please enter email and password', 'error');
        return;
      }
      
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="loading"></span> Logging in...';
      
      try {
        const { data, error } = await _supabase.auth.signInWithPassword({
          email,
          password,
        });
        
        if (error) throw error;
        
        // Check if user is admin
        const { data: profile, error: profileError } = await _supabase
          .from('profiles')
          .select('is_admin')
          .eq('id', data.user.id)
          .single();
        
        if (profileError) throw profileError;
        
        if (!profile || !profile.is_admin) {
          await _supabase.auth.signOut();
          throw new Error('Not authorized as admin');
        }
        
        showMessage('Login successful! Redirecting...', 'success');
        
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);
        
      } catch (error) {
        showMessage(error.message, 'error');
        loginBtn.disabled = false;
        loginBtn.innerHTML = 'Login as Admin';
      }
    });
  </script>
</body>
</html>
