<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#7c3aed">
  <title>zerøbyte | Broadcast Center</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      min-height: 100vh;
      color: #ffffff;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; padding-bottom: 85px; }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(124,58,237,0.2);
      flex-wrap: wrap;
      gap: 15px;
    }
    .logo { font-size: 26px; font-weight: bold; background: linear-gradient(135deg, #7c3aed, #a855f7); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .back-link { color: #7c3aed; text-decoration: none; padding: 8px 20px; border: 1px solid #7c3aed; border-radius: 10px; transition: all 0.3s ease; }
    .back-link:hover { background: #7c3aed; color: white; }
    .section { background: rgba(15,23,42,0.7); backdrop-filter: blur(10px); border-radius: 24px; padding: 30px; margin-bottom: 30px; }
    .section-title { font-size: 24px; margin-bottom: 25px; color: #cbd5e1; }
    .section-title i { color: #7c3aed; margin-right: 12px; }
    .form-group { margin-bottom: 22px; }
    label { display: block; margin-bottom: 8px; color: #94a3b8; font-weight: 500; }
    label i { margin-right: 8px; color: #7c3aed; }
    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 14px;
      color: white;
      font-size: 16px;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #7c3aed; }
    textarea { resize: vertical; min-height: 120px; }
    .btn-primary {
      padding: 14px 32px;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border: none;
      border-radius: 14px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(124,58,237,0.4); }
    .btn-danger { background: #ef4444; border: none; padding: 6px 14px; border-radius: 8px; color: white; cursor: pointer; }
    .message { padding: 14px; border-radius: 14px; margin-bottom: 25px; text-align: center; }
    .success { background: rgba(34,197,94,0.2); border: 1px solid #22c55e; color: #22c55e; }
    .error { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #ef4444; }
    .table-wrapper { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 14px 12px; text-align: left; border-bottom: 1px solid rgba(124,58,237,0.15); }
    th { color: #7c3aed; }
    td { color: #cbd5e1; }
    .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; display: inline-block; }
    .priority-high { background: rgba(239,68,68,0.2); color: #ef4444; }
    .priority-urgent { background: rgba(245,158,11,0.2); color: #f59e0b; }
    .priority-normal { background: rgba(124,58,237,0.2); color: #7c3aed; }
    .status-active { background: rgba(34,197,94,0.2); color: #22c55e; }
    .status-expired { background: rgba(148,163,184,0.2); color: #94a3b8; }
    .empty-state { text-align: center; padding: 50px; color: #64748b; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(15,23,42,0.95); backdrop-filter: blur(10px);
      display: flex; justify-content: space-around; padding: 12px 20px;
      border-top: 1px solid rgba(124,58,237,0.2); z-index: 100;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      color: #94a3b8; text-decoration: none; font-size: 11px;
      cursor: pointer; padding: 5px 15px; border-radius: 10px;
    }
    .nav-item:hover, .nav-item.active { color: #7c3aed; background: rgba(124,58,237,0.1); }
    @media (max-width: 768px) { .container { padding: 15px; padding-bottom: 80px; } .section { padding: 20px; } .section-title { font-size: 20px; } th, td { padding: 10px 8px; font-size: 12px; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="logo">Broadcast Center</div>
      <a href="dashboard.html" class="back-link"><i class="fas fa-arrow-left"></i> Dashboard</a>
    </div>
    <div id="messageContainer"></div>

    <div class="section">
      <h2 class="section-title"><i class="fas fa-broadcast-tower"></i> Send Broadcast</h2>
      <form id="broadcastForm">
        <div class="form-group"><label><i class="fas fa-heading"></i> Title</label><input type="text" id="title" placeholder="e.g., 🎉 New Feature Available!" required></div>
        <div class="form-group"><label><i class="fas fa-envelope-open-text"></i> Message</label><textarea id="messageContent" placeholder="Write your announcement..." required></textarea></div>
        <div class="form-group"><label><i class="fas fa-flag"></i> Priority</label><select id="priority"><option value="normal">📘 Normal</option><option value="high">📙 High</option><option value="urgent">📕 Urgent</option></select></div>
        <div class="form-group"><label><i class="fas fa-users"></i> Audience</label><select id="targetAudience"><option value="all">🌍 All Users</option><option value="active_users">⚡ Active (Last 7 days)</option><option value="new_users">🆕 New (Last 30 days)</option></select></div>
        <div class="form-group"><label><i class="fas fa-calendar-times"></i> Expires (Optional)</label><input type="datetime-local" id="expiresAt"></div>
        <button type="submit" class="btn-primary"><i class="fas fa-paper-plane"></i> Send Notification</button>
      </form>
    </div>

    <div class="section">
      <h2 class="section-title"><i class="fas fa-history"></i> Sent Notifications</h2>
      <div class="table-wrapper">
        <table>
          <thead><tr><th>Title</th><th>Message</th><th>Priority</th><th>Audience</th><th>Sent Date</th><th>Recipients</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="notificationsList"></tbody>
        </table>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item" onclick="window.location.href='dashboard.html'"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></div>
      <div class="nav-item active"><i class="fas fa-broadcast-tower"></i><span>Broadcast</span></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://yaibrpthbugcycvzbuie.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaWJycHRoYnVnY3ljdnpidWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTIzMDMsImV4cCI6MjA5NDU4ODMwM30.-BwWDwdpL9rAois22PU3ATtzlAzdSx9qN6L71czHFXU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let currentUser = null;

    function showMessage(text, type) { const c = document.getElementById('messageContainer'); c.innerHTML = `<div class="message ${type}">${text}</div>`; setTimeout(() => c.innerHTML = '', 5000); }

    async function checkAdmin() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return null; }
      const { data: profile } = await _supabase.from('profiles').select('is_admin').eq('id', session.user.id).single();
      if (!profile?.is_admin) { await _supabase.auth.signOut(); window.location.href = 'index.html'; return null; }
      currentUser = session.user;
      return currentUser;
    }

    async function getTargetUsers(audience) {
      let query = _supabase.from('profiles').select('id');
      if (audience === 'active_users') { const d = new Date(); d.setDate(d.getDate() - 7); query = query.gte('last_seen', d.toISOString()); }
      else if (audience === 'new_users') { const d = new Date(); d.setDate(d.getDate() - 30); query = query.gte('created_at', d.toISOString()); }
      const { data } = await query;
      return data || [];
    }

    async function sendToUsers(users, notificationId) {
      const userNotifications = users.map(u => ({ user_id: u.id, notification_id: notificationId, is_read: false }));
      for (let i = 0; i < userNotifications.length; i += 100) { await _supabase.from('user_notifications').insert(userNotifications.slice(i, i + 100)); }
      return userNotifications.length;
    }

    document.getElementById('broadcastForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value;
      const message = document.getElementById('messageContent').value;
      const priority = document.getElementById('priority').value;
      const targetAudience = document.getElementById('targetAudience').value;
      const expiresAt = document.getElementById('expiresAt').value;
      if (!title || !message) { showMessage('Fill all fields', 'error'); return; }
      try {
        const { data: notification, error } = await _supabase.from('notifications').insert([{ title, message, type: 'broadcast', priority, target_audience: targetAudience, created_by: currentUser.id, expires_at: expiresAt || null }]).select().single();
        if (error) throw error;
        const users = await getTargetUsers(targetAudience);
        if (users.length === 0) { showMessage('No users found', 'error'); return; }
        const sent = await sendToUsers(users, notification.id);
        showMessage(`✅ Sent to ${sent} users!`, 'success');
        document.getElementById('title').value = '';
        document.getElementById('messageContent').value = '';
        document.getElementById('expiresAt').value = '';
        loadSentNotifications();
      } catch (error) { showMessage('Error: ' + error.message, 'error'); }
    });

    async function loadSentNotifications() {
      const { data: notifications } = await _supabase.from('notifications').select('*').eq('created_by', currentUser.id).order('created_at', { ascending: false });
      const tbody = document.getElementById('notificationsList');
      tbody.innerHTML = '';
      if (!notifications || notifications.length === 0) { tbody.innerHTML = '<tr><td colspan="8" class="empty-state">No notifications sent yet</td></tr>'; return; }
      for (const notif of notifications) {
        const { count } = await _supabase.from('user_notifications').select('*', { count: 'exact', head: true }).eq('notification_id', notif.id);
        const isExpired = notif.expires_at && new Date(notif.expires_at) < new Date();
        const priorityClass = notif.priority === 'urgent' ? 'priority-urgent' : notif.priority === 'high' ? 'priority-high' : 'priority-normal';
        const audienceText = notif.target_audience === 'all' ? 'All' : notif.target_audience === 'active_users' ? 'Active' : 'New';
        const row = tbody.insertRow();
        row.innerHTML = `
          <td><strong>${escapeHtml(notif.title)}</strong></td>
          <td style="max-width:250px">${escapeHtml(notif.message.substring(0, 60))}${notif.message.length > 60 ? '...' : ''}</td>
          <td><span class="status-badge ${priorityClass}">${notif.priority}</span></td>
          <td style="font-size:12px">${audienceText}</td>
          <td style="font-size:12px">${new Date(notif.created_at).toLocaleString()}</td>
          <td style="font-size:12px">${count || 0} users</td>
          <td><span class="status-badge ${isExpired ? 'status-expired' : 'status-active'}">${isExpired ? 'Expired' : 'Active'}</span></td>
          <td><button class="btn-danger" onclick="deleteNotification('${notif.id}')"><i class="fas fa-trash"></i></button></td>
        `;
      }
    }

    window.deleteNotification = async (id) => {
      if (confirm('Delete this notification?')) {
        await _supabase.from('user_notifications').delete().eq('notification_id', id);
        await _supabase.from('notifications').delete().eq('id', id);
        await loadSentNotifications();
        showMessage('Deleted', 'success');
      }
    };

    function escapeHtml(text) { if (!text) return ''; const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

    async function init() { await checkAdmin(); if (currentUser) await loadSentNotifications(); }
    init();
  </script>
</body>
</html>
