<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin Dashboard - zerøbyte</title>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: white; padding-bottom: 80px; }
.bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.95); display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid rgba(255,255,255,0.1); }
.nav-item { background: none; border: none; color: #64748b; padding: 8px 20px; border-radius: 12px; cursor: pointer; font-size: 14px; }
.nav-item.active { color: #a855f7; background: rgba(168,85,247,0.1); }
.main-content { padding: 20px; max-width: 600px; margin: 0 auto; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
.stats-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 20px; text-align: center; }
.stat-number { font-size: 28px; font-weight: bold; color: #a855f7; }
.chart-card { background: rgba(255,255,255,0.05); padding: 16px; border-radius: 20px; margin-bottom: 20px; }
canvas { max-height: 200px; width: 100%; }
.section-title { margin: 20px 0 15px 0; }
.user-card, .msg-card { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
.delete-btn { background: rgba(239,68,68,0.2); border: none; padding: 6px 12px; border-radius: 10px; color: #fca5a5; cursor: pointer; }
.empty { text-align: center; padding: 40px; color: #64748b; }
.hidden { display: none; }
.logout-btn { background: rgba(239,68,68,0.2); border: none; padding: 10px 16px; border-radius: 12px; color: #fca5a5; cursor: pointer; }
</style>
</head>
<body>
<div class="bottom-nav">
    <button class="nav-item active" data-section="dashboard">Dashboard</button>
    <button class="nav-item" data-section="users">Users</button>
    <button class="nav-item" data-section="messages">Messages</button>
</div>
<div class="main-content">
    <div class="header">
        <h1><i class="fas fa-shield-alt"></i> Admin</h1>
        <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
    <div id="dashboardSection">
        <div class="stats-grid" id="statsGrid"></div>
        <div class="chart-card"><canvas id="userChart"></canvas></div>
        <div class="chart-card"><canvas id="messageChart"></canvas></div>
    </div>
    <div id="usersSection" class="hidden">
        <div class="section-title">All Users</div>
        <div id="usersList"></div>
    </div>
    <div id="messagesSection" class="hidden">
        <div class="section-title">Recent Messages</div>
        <div id="messagesList"></div>
    </div>
</div>
<script>
const _supabase = window.supabase.createClient(
    "https://ievgpyzphaialonfonof.supabase.co",
    "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlldmdweXpwaGFpYWxvbmZvbm9mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2Njk2MTAsImV4cCI6MjA5NDI0NTYxMH0.tg3ao7uROEZqvw1Tlkpe2o5glMF7LNRDj6uYaOs_Zvs"
);
let userChart = null, messageChart = null;

async function checkAdmin() {
    const { data: { user } } = await _supabase.auth.getUser();
    if (!user) { window.location.href = "index.html"; return; }
    const { data: profile } = await _supabase.from("profiles").select("is_admin").eq("id", user.id).single();
    if (!profile?.is_admin) { window.location.href = "index.html"; }
}

async function loadStats() {
    const uc = await _supabase.from("profiles").select("*", { count: 'exact', head: true });
    const mc = await _supabase.from("messages").select("*", { count: 'exact', head: true });
    document.getElementById("statsGrid").innerHTML = `<div class="stat-card"><div class="stat-number">${uc.count || 0}</div><div>Total Users</div></div><div class="stat-card"><div class="stat-number">${mc.count || 0}</div><div>Total Messages</div></div>`;
}

async function loadCharts() {
    const last7Days = [];
    for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); last7Days.push(d.toISOString().split('T')[0]); }
    const userData = [], msgData = [];
    for (const day of last7Days) {
        const nextDay = new Date(day); nextDay.setDate(nextDay.getDate() + 1);
        const { count: uc } = await _supabase.from("profiles").select("*", { count: 'exact', head: true }).gte("created_at", day).lt("created_at", nextDay.toISOString().split('T')[0]);
        userData.push(uc || 0);
        const { count: mc } = await _supabase.from("messages").select("*", { count: 'exact', head: true }).gte("created_at", day).lt("created_at", nextDay.toISOString().split('T')[0]);
        msgData.push(mc || 0);
    }
    const ctx1 = document.getElementById('userChart').getContext('2d');
    const ctx2 = document.getElementById('messageChart').getContext('2d');
    if (userChart) userChart.destroy();
    if (messageChart) messageChart.destroy();
    userChart = new Chart(ctx1, { type: 'line', data: { labels: last7Days.map(d => d.substring(5)), datasets: [{ label: 'New Users', data: userData, borderColor: '#a855f7', fill: true }] } });
    messageChart = new Chart(ctx2, { type: 'bar', data: { labels: last7Days.map(d => d.substring(5)), datasets: [{ label: 'Messages', data: msgData, backgroundColor: '#7c3aed' }] } });
}

async function loadUsers() {
    const { data } = await _supabase.from("profiles").select("*").order("created_at", { ascending: false });
    if (!data || data.length === 0) { document.getElementById("usersList").innerHTML = '<div class="empty">No users found</div>'; return; }
    document.getElementById("usersList").innerHTML = data.map(u => `<div class="user-card"><div><strong>${escapeHtml(u.display_name || u.username || 'User')}</strong><br><small>${escapeHtml(u.email || '')}</small></div><button class="delete-btn" onclick="deleteUser('${u.id}')">Delete</button></div>`).join("");
}

async function loadMessages() {
    const { data } = await _supabase.from("messages").select("*").order("created_at", { ascending: false }).limit(50);
    if (!data || data.length === 0) { document.getElementById("messagesList").innerHTML = '<div class="empty">No messages yet</div>'; return; }
    document.getElementById("messagesList").innerHTML = data.map(m => `<div class="msg-card"><div><div>${escapeHtml(m.content.substring(0, 60))}</div><small>${new Date(m.created_at).toLocaleString()}</small></div><button class="delete-btn" onclick="deleteMessage('${m.id}')">Delete</button></div>`).join("");
}

async function deleteUser(id) { if(confirm("Delete this user?")) { await _supabase.from("profiles").delete().eq("id", id); loadUsers(); loadStats(); } }
async function deleteMessage(id) { if(confirm("Delete this message?")) { await _supabase.from("messages").delete().eq("id", id); loadMessages(); } }

function showSection(section) {
    document.getElementById("dashboardSection").classList.add("hidden");
    document.getElementById("usersSection").classList.add("hidden");
    document.getElementById("messagesSection").classList.add("hidden");
    document.getElementById(section + "Section").classList.remove("hidden");
    if (section === 'users') loadUsers();
    if (section === 'messages') loadMessages();
}

document.querySelectorAll(".nav-item").forEach(btn => {
    btn.addEventListener("click", () => {
        document.querySelectorAll(".nav-item").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        showSection(btn.dataset.section);
    });
});
document.getElementById("logoutBtn").addEventListener("click", async () => { await _supabase.auth.signOut(); window.location.href = "index.html"; });

function escapeHtml(t) { if(!t) return ''; const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

checkAdmin(); loadStats(); loadCharts(); loadMessages();
</script>
</body>
</html>
