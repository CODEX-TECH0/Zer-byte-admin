<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin dashboard for zerøbyte - Manage users, messages, reports, and platform analytics.">
  <meta name="robots" content="noindex, nofollow">
  <title>zerøbyte | Admin Dashboard - Platform Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
      padding-bottom: 85px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 0;
      margin-bottom: 30px;
      border-bottom: 1px solid rgba(124, 58, 237, 0.2);
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 26px;
      font-weight: bold;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .admin-info {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .btn-logout {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 8px 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .btn-logout:hover {
      background: #ef4444;
      color: white;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 25px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(124, 58, 237, 0.2);
    }

    .stat-card:hover {
      transform: translateY(-5px);
      border-color: #7c3aed;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .stat-card i {
      font-size: 36px;
      color: #7c3aed;
      margin-bottom: 12px;
    }

    .stat-number {
      font-size: 36px;
      font-weight: bold;
    }

    .stat-label {
      color: #94a3b8;
      margin-top: 8px;
      font-size: 13px;
    }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 25px;
      flex-wrap: wrap;
      background: rgba(15, 23, 42, 0.8);
      padding: 8px;
      border-radius: 60px;
      backdrop-filter: blur(10px);
    }

    .tab-btn {
      padding: 12px 28px;
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      border-radius: 50px;
    }

    .tab-btn:hover {
      color: #7c3aed;
      background: rgba(124, 58, 237, 0.1);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
    }

    /* Tab Content */
    .tab-content {
      display: none;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 25px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tab-content.active {
      display: block;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .section-header h3 {
      font-size: 20px;
      color: #cbd5e1;
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    .search-box input {
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(124, 58, 237, 0.3);
      border-radius: 10px;
      color: white;
      width: 250px;
    }

    .btn-export {
      background: #22c55e;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-export:hover {
      background: #16a34a;
      transform: scale(1.02);
    }

    .btn-broadcast {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-broadcast:hover {
      transform: scale(1.02);
      box-shadow: 0 5px 15px rgba(124, 58, 237, 0.4);
    }

    /* Tables */
    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 14px 12px;
      text-align: left;
      border-bottom: 1px solid rgba(124, 58, 237, 0.15);
    }

    th {
      color: #7c3aed;
      font-weight: 600;
    }

    td {
      color: #cbd5e1;
    }

    .user-avatar-small {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      display: inline-block;
    }

    .status-online {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
    }

    .status-offline {
      background: rgba(148, 163, 184, 0.2);
      color: #94a3b8;
    }

    .status-pending {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
    }

    .status-resolved {
      background: rgba(34, 197, 94, 0.2);
      color: #22c55e;
    }

    .btn-danger {
      background: #ef4444;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-danger:hover {
      background: #dc2626;
      transform: scale(1.02);
    }

    .btn-warning {
      background: #f59e0b;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-warning:hover {
      background: #d97706;
    }

    .btn-success {
      background: #22c55e;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-success:hover {
      background: #16a34a;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 50px;
      color: #64748b;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-around;
      padding: 12px 20px;
      border-top: 1px solid rgba(124, 58, 237, 0.2);
      z-index: 100;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 11px;
      transition: color 0.3s ease;
      cursor: pointer;
      padding: 5px 15px;
      border-radius: 10px;
    }

    .nav-item i {
      font-size: 20px;
    }

    .nav-item:hover, .nav-item.active {
      color: #7c3aed;
      background: rgba(124, 58, 237, 0.1);
    }

    @media (max-width: 768px) {
      .container {
        padding: 15px;
        padding-bottom: 80px;
      }
      
      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      
      .stat-card {
        padding: 18px 12px;
      }
      
      .stat-number {
        font-size: 28px;
      }
      
      .section-header {
        flex-direction: column;
        align-items: stretch;
      }
      
      .search-box {
        flex-direction: column;
      }
      
      .search-box input {
        width: 100%;
      }
      
      th, td {
        padding: 10px 8px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="logo">zerøbyte Admin</div>
      <div class="admin-info">
        <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">
      <div class="stat-card" onclick="showTab('users')">
        <i class="fas fa-users"></i>
        <div class="stat-number" id="totalUsers">0</div>
        <div class="stat-label">Total Users</div>
      </div>
      <div class="stat-card" onclick="showTab('messages')">
        <i class="fas fa-comments"></i>
        <div class="stat-number" id="totalMessages">0</div>
        <div class="stat-label">Total Messages</div>
      </div>
      <div class="stat-card" onclick="showTab('reports')">
        <i class="fas fa-flag"></i>
        <div class="stat-number" id="pendingReports">0</div>
        <div class="stat-label">Pending Reports</div>
      </div>
      <div class="stat-card" onclick="window.location.href='notifications.html'">
        <i class="fas fa-broadcast-tower"></i>
        <div class="stat-number" id="broadcastCount">0</div>
        <div class="stat-label">Broadcasts</div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="showTab('users')"><i class="fas fa-users"></i> Users</button>
      <button class="tab-btn" onclick="showTab('messages')"><i class="fas fa-comments"></i> Messages</button>
      <button class="tab-btn" onclick="showTab('reports')"><i class="fas fa-flag"></i> Reports</button>
      <button class="tab-btn" onclick="window.location.href='notifications.html'"><i class="fas fa-broadcast-tower"></i> Broadcast</button>
    </div>

    <!-- Users Tab -->
    <div id="usersTab" class="tab-content active">
      <div class="section-header">
        <h3><i class="fas fa-users"></i> User Management</h3>
        <div class="search-box">
          <input type="text" id="userSearch" placeholder="Search by name, email..." onkeyup="searchUsers()">
          <button class="btn-export" onclick="exportUsersCSV()"><i class="fas fa-download"></i> Export CSV</button>
        </div>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>User</th><th>Email</th><th>Handle</th><th>Status</th><th>Joined</th><th>Actions</th>
          </thead>
          <tbody id="usersList"></tbody>
         </table>
      </div>
    </div>

    <!-- Messages Tab -->
    <div id="messagesTab" class="tab-content">
      <div class="section-header">
        <h3><i class="fas fa-comments"></i> Recent Messages</h3>
        <div class="search-box">
          <input type="text" id="messageSearch" placeholder="Search messages..." onkeyup="searchMessages()">
        </div>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>From</th><th>To</th><th>Message</th><th>Time</th><th>Actions</th>
          </thead>
          <tbody id="messagesList"></tbody>
         </table>
      </div>
    </div>

    <!-- Reports Tab -->
    <div id="reportsTab" class="tab-content">
      <div class="section-header">
        <h3><i class="fas fa-flag"></i> User Reports</h3>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>Message</th><th>Reported By</th><th>Reason</th><th>Status</th><th>Actions</th>
          </thead>
          <tbody id="reportsList"></tbody>
         </table>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <div class="nav-item active" onclick="showTab('users')">
        <i class="fas fa-users"></i>
        <span>Users</span>
      </div>
      <div class="nav-item" onclick="showTab('messages')">
        <i class="fas fa-comments"></i>
        <span>Messages</span>
      </div>
      <div class="nav-item" onclick="showTab('reports')">
        <i class="fas fa-flag"></i>
        <span>Reports</span>
      </div>
      <div class="nav-item" onclick="window.location.href='notifications.html'">
        <i class="fas fa-broadcast-tower"></i>
        <span>Broadcast</span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://yaibrpthbugcycvzbuie.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlhaWJycHRoYnVnY3ljdnpidWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMTIzMDMsImV4cCI6MjA5NDU4ODMwM30.-BwWDwdpL9rAois22PU3ATtzlAzdSx9qN6L71czHFXU';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let currentUser = null;
    let allUsers = [];
    let allMessages = [];
    let allReports = [];

    async function checkAdmin() {
      const { data: { session } } = await _supabase.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return null;
      }
      
      const { data: profile } = await _supabase
        .from('profiles')
        .select('is_admin')
        .eq('id', session.user.id)
        .single();
      
      if (!profile || !profile.is_admin) {
        await _supabase.auth.signOut();
        window.location.href = 'index.html';
        return null;
      }
      
      currentUser = session.user;
      return currentUser;
    }

    async function loadStats() {
      const { count: users } = await _supabase.from('profiles').select('*', { count: 'exact', head: true });
      const { count: messages } = await _supabase.from('messages').select('*', { count: 'exact', head: true });
      const { count: reports } = await _supabase.from('reports').select('*', { count: 'exact', head: true }).eq('status', 'pending');
      const { count: broadcasts } = await _supabase.from('notifications').select('*', { count: 'exact', head: true });
      
      document.getElementById('totalUsers').textContent = (users || 0).toLocaleString();
      document.getElementById('totalMessages').textContent = (messages || 0).toLocaleString();
      document.getElementById('pendingReports').textContent = reports || 0;
      document.getElementById('broadcastCount').textContent = broadcasts || 0;
    }

    async function loadUsers() {
      const { data: users } = await _supabase
        .from('profiles')
        .select('*')
        .order('created_at', { ascending: false });
      
      allUsers = users || [];
      displayUsers(allUsers);
    }

    function displayUsers(users) {
      const tbody = document.getElementById('usersList');
      tbody.innerHTML = '';
      
      if (users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="empty-state">No users found</td></tr>';
        return;
      }
      
      for (const user of users) {
        const row = tbody.insertRow();
        row.innerHTML = `
          <td>
            <div style="display:flex; align-items:center; gap:10px">
              <div class="user-avatar-small">${user.avatar_url ? `<img src="${user.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">` : '<i class="fas fa-user"></i>'}</div>
              <div><strong>${escapeHtml(user.display_name || user.username)}</strong><br><span style="font-size:11px;color:#64748b">@${escapeHtml(user.user_handle || user.username)}</span></div>
            </div>
          </td>
          <td>${escapeHtml(user.email)}</td>
          <td style="font-size:12px">@${escapeHtml(user.user_handle || user.username)}</td>
          <td><span class="status-badge ${user.is_online ? 'status-online' : 'status-offline'}">${user.is_online ? 'Online' : 'Offline'}</span></td>
          <td style="font-size:12px">${new Date(user.created_at).toLocaleDateString()}</td>
          <td>
            <button class="btn-danger" onclick="deleteUser('${user.id}')" title="Delete User"><i class="fas fa-trash"></i></button>
          </td>
        `;
      }
    }

    window.searchUsers = () => {
      const query = document.getElementById('userSearch').value.toLowerCase();
      const filtered = allUsers.filter(u => 
        (u.display_name && u.display_name.toLowerCase().includes(query)) ||
        (u.username && u.username.toLowerCase().includes(query)) ||
        (u.email && u.email.toLowerCase().includes(query))
      );
      displayUsers(filtered);
    };

    window.deleteUser = async (userId) => {
      if (confirm('⚠️ WARNING: This will permanently delete the user and ALL their data. This action cannot be undone. Continue?')) {
        await _supabase.from('profiles').delete().eq('id', userId);
        await _supabase.auth.admin.deleteUser(userId);
        await loadUsers();
        await loadStats();
        alert('User deleted successfully');
      }
    };

    async function loadMessages() {
      const { data: messages } = await _supabase
        .from('messages')
        .select('*')
        .order('created_at', { ascending: false })
        .limit(200);
      
      allMessages = messages || [];
      displayMessages(allMessages);
    }

    function displayMessages(messages) {
      const tbody = document.getElementById('messagesList');
      tbody.innerHTML = '';
      
      if (messages.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No messages found</td></tr>';
        return;
      }
      
      Promise.all(messages.map(async (msg) => {
        const [sender, receiver] = await Promise.all([
          _supabase.from('profiles').select('display_name, username').eq('id', msg.sender_id).single(),
          _supabase.from('profiles').select('display_name, username').eq('id', msg.receiver_id).single()
        ]);
        
        return { msg, sender: sender.data, receiver: receiver.data };
      })).then(results => {
        tbody.innerHTML = '';
        for (const { msg, sender, receiver } of results) {
          const row = tbody.insertRow();
          row.innerHTML = `
            <td>${escapeHtml(sender?.display_name || sender?.username || 'Unknown')}</td>
            <td>${escapeHtml(receiver?.display_name || receiver?.username || 'Unknown')}</td>
            <td style="max-width:300px; word-break:break-word">${escapeHtml(msg.content.substring(0, 80))}${msg.content.length > 80 ? '...' : ''}</td>
            <td style="font-size:11px">${new Date(msg.created_at).toLocaleString()}</td>
            <td><button class="btn-danger" onclick="deleteMessage('${msg.id}')"><i class="fas fa-trash"></i></button></td>
          `;
        }
      });
    }

    window.searchMessages = () => {
      const query = document.getElementById('messageSearch').value.toLowerCase();
      const filtered = allMessages.filter(m => m.content.toLowerCase().includes(query));
      displayMessages(filtered);
    };

    window.deleteMessage = async (messageId) => {
      if (confirm('Delete this message?')) {
        await _supabase.from('messages').delete().eq('id', messageId);
        await loadMessages();
        await loadStats();
      }
    };

    async function loadReports() {
      const { data: reports } = await _supabase
        .from('reports')
        .select('*')
        .order('created_at', { ascending: false });
      
      allReports = reports || [];
      const tbody = document.getElementById('reportsList');
      tbody.innerHTML = '';
      
      if (reports.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No reports found</td></tr>';
        return;
      }
      
      for (const report of reports) {
        const { data: reporter } = await _supabase
          .from('profiles')
          .select('display_name, username')
          .eq('id', report.reported_by)
          .single();
        
        const row = tbody.insertRow();
        row.innerHTML = `
          <td style="max-width:250px; word-break:break-word">"${escapeHtml(report.message_content.substring(0, 60))}..."</td>
          <td>${escapeHtml(reporter?.display_name || reporter?.username || 'Unknown')}</td>
          <td style="max-width:200px">${escapeHtml(report.reason || 'No reason provided')}</td>
          <td><span class="status-badge ${report.status === 'pending' ? 'status-pending' : 'status-resolved'}">${report.status}</span></td>
          <td>
            ${report.status === 'pending' ? `<button class="btn-success" onclick="resolveReport('${report.id}')"><i class="fas fa-check"></i> Resolve</button> ` : ''}
            <button class="btn-danger" onclick="deleteReport('${report.id}')"><i class="fas fa-trash"></i></button>
          </td>
        `;
      }
    }

    window.resolveReport = async (reportId) => {
      await _supabase.from('reports').update({ status: 'resolved' }).eq('id', reportId);
      await loadReports();
      await loadStats();
    };

    window.deleteReport = async (reportId) => {
      if (confirm('Delete this report?')) {
        await _supabase.from('reports').delete().eq('id', reportId);
        await loadReports();
        await loadStats();
      }
    };

    window.exportUsersCSV = () => {
      let csv = 'Name,Email,Username,Handle,Bio,Location,Status,Created At\n';
      for (const user of allUsers) {
        csv += `"${escapeCsv(user.display_name || user.username)}","${user.email}","${user.username}","${user.user_handle}","${escapeCsv(user.bio || '')}","${escapeCsv(user.location || '')}","${user.is_online ? 'Online' : 'Offline'}","${user.created_at}"\n`;
      }
      
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `zerobyte_users_${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    };

    function escapeCsv(text) {
      if (!text) return '';
      return text.replace(/"/g, '""');
    }

    window.showTab = (tab) => {
      document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(`${tab}Tab`).classList.add('active');
      
      const buttons = document.querySelectorAll('.tab-btn');
      const tabMap = { users: 0, messages: 1, reports: 2 };
      if (buttons[tabMap[tab]]) buttons[tabMap[tab]].classList.add('active');
      
      if (tab === 'reports') loadReports();
      if (tab === 'messages') loadMessages();
    };

    window.logout = async () => {
      await _supabase.auth.signOut();
      window.location.href = 'index.html';
    };

    function escapeHtml(text) {
      if (!text) return '';
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function init() {
      await checkAdmin();
      if (currentUser) {
        await loadStats();
        await loadUsers();
        await loadMessages();
        await loadReports();
        
        // Refresh every 30 seconds
        setInterval(() => {
          loadStats();
          if (document.getElementById('usersTab').classList.contains('active')) loadUsers();
          if (document.getElementById('messagesTab').classList.contains('active')) loadMessages();
          if (document.getElementById('reportsTab').classList.contains('active')) loadReports();
        }, 30000);
      }
    }

    init();
  </script>
</body>
</html>
